<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="register, registrarse, login, ingresar, talking, aprender ingles" />
  <title>Registro</title>
  <link rel="icon" href="images/wechat.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles/index.css" />
</head>
<body>
  <div class="register-container"> 
    <div class="register">
      <div class="d-flex justify-content-center align-items-center gap-3">
        <div class="d-flex justify-content-center align-items-center">
          <h4>Registro</h4>
        </div>
        <img class="logo-register" src="images/wechat.png" alt="register-icon" />
      </div>
      <!-- Se actualizan los atributos name para que coincidan con el DTO -->
      <form class="register-form" id="register-form" >
        <div class="input-group mt-3 justify-content-center">
          <label for="name">Nombre</label>
        </div>
        <div class="d-flex justify-content-center align-items-center">
          <input type="text" id="name" name="name" class="form-control" required />
        </div>
                    
        <div class="input-group mt-3 justify-content-center">
          <label for="lastName">Apellido</label>
        </div>
        <div class="d-flex justify-content-center align-items-center">
          <input type="text" id="lastName" name="lastName" class="form-control" required />
        </div>

        <div class="input-group mt-3 justify-content-center">
          <label for="birthDate">Fecha de Nacimiento</label>
        </div>
        <div class="d-flex justify-content-center align-items-center">
          <input type="date" id="birthDate" name="birthDate" class="form-control" required />
        </div>

        <div class="input-group mt-3 justify-content-center">
          <label for="email">Correo Electrónico</label>
        </div>
        <div class="d-flex justify-content-center align-items-center">
          <input type="email" id="email" name="email" class="form-control" required />
        </div>

        <div class="input-group mt-3 justify-content-center">
          <label for="password">Contraseña</label>
        </div>
        <div class="d-flex justify-content-center align-items-center">
          <input type="password" id="password" name="password" class="form-control" required />
        </div>

        <div class="input-group mt-3 justify-content-center">
          <label for="nationality">Nacionalidad</label>
        </div>
        <div class="d-flex justify-content-center align-items-center">
          <input type="text" id="nationality" name="nationality" class="form-control" required />
        </div>
                    
        <div class="input-group mt-3 justify-content-center">
          <label for="province">Provincia</label>
        </div>
        <div class="d-flex justify-content-center align-items-center">
          <input type="text" id="province" name="province" class="form-control" required />
        </div>
                    
        <button type="submit" id="btn-submit" class="btn btn-info text-white w-100 mt-3 fw-semibold">Registrar</button>
      </form>
    </div>
  </div> 

  <!-- Se incluye el script que gestiona el envío -->
  <script type="module" src="./js/register/Register.js"></script>
</body>
</html>
